services:
  - type: web
    name: secure-config-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: secure-config-db
          property: connectionString

databases:
  - name: secure-config-db
    plan: free
    databaseName: secureconfig
    user: secureconfig
